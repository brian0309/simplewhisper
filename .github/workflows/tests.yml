name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        # The suite only needs pytest plus numpy/av for the audio helpers;
        # the heavy ML dependencies (faster-whisper, sherpa-onnx) are imported
        # lazily, so the package itself is installed without its dependencies.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy av
          python -m pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest -v
